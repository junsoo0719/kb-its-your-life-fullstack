<!doctype html>
<html>
  <head>
    <title>CSS3 Display Property</title>
    <style>
      #box {
        /* inline: width, height, margin, padding 속성 지정 x(부모 값으로 지정됨) */
        /* inline-block: width, height, margin, padding 속성 지정 ex) img 태그 */
        display: inline; /* inline-block */
        background-color: red;
        width: 100px;
        height: 50px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <p>의미 없는 더미 객체</p>
    <span>더미 객체</span>
    <div id="box">대상 객체</div>
    <span>더미 객체</span>
    <p>의미 없는 더미 객체</p>
  </body>
</html>
