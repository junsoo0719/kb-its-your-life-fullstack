<!doctype html>
<html>
  <head>
    <title>CSS3 Display Property</title>
    <style>
      #box {
        /* div를 span처럼 사용할 수 o 반대로 span에 block 설정할 수도 o */
        /* inline: width, height, margin, padding 속성 지정 x(부모 값으로 지정됨) */
        display: inline;
      }
    </style>
  </head>
  <body>
    <span>더미 객체</span>
    <div id="box">대상 객체</div>
    <span>더미 객체</span>
  </body>
</html>
