<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 127.0.0.1: 자기자신 IP (=localhost), 포트 번호 없으면 기본 80이라는 의미 -->
    <!-- 메서드 지정x: GET방식 -->
    <!-- action: 정보 전송할 페이지, 보통은 백엔드 서버(생략하면 현재 url로 submit) -->
    <form method="GET">
      <!-- fieldset, legend: 외곽선 -->
      <fieldset>
        <legend>입력 양식</legend>
        <table>
          <tr>
            <td><label for="name">이름</label></td>
            <!-- id는 서버로 전달되는 내용 아님, 속성 나열 순서는 상관x -->
            <td><input id="name" name="name" type="text" /></td>
          </tr>
          <tr>
            <td><label for="mail">이메일</label></td>
            <!-- email타입: email형태 입력 요구 -->
            <td>
              <input id="mail" name="email" type="email" value="test@abc.com" />
            </td>
          </tr>
        </table>
        <input type="submit" />
      </fieldset>
    </form>
  </body>
</html>
