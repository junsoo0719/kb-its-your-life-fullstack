<!doctype html>
<html>
  <head>
    <title>Document Object Model</title>
    <script>
      // body 태그 전이라 오류, null 리턴
      //   document가 다 완성된 이후에 배치해야됨
      // h1 태그의 배경 색상을 변경합니다.
      document.querySelector('h1').style.backgroundColor = 'red';
      // h2 태그의 글자 색상을 변경합니다.
      document.querySelector('h2').style.color = 'red';
    </script>
  </head>
  <body>
    <h1>Process - 1</h1>
    <h2>Process - 2</h2>
  </body>
</html>
