<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      /* 같은 클래스 중 특정 태그만 지정 가능 */
      li.select {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1 class="select">제목 글자</h1>

    <ul>
      <li class="select">사과</li>
      <li>바나나</li>
      <li>오렌지</li>
      <li>감</li>
    </ul>
  </body>
</html>
