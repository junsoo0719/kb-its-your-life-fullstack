<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      /* id 중복 시 자바스크립트로 작성하면 첫번째 태그에만 적용됨 */
      /* h1#rint와 같은 식으로도 사용가능, id중복되는 경우는 없으므로 거의 사용x */
      #rint {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1 id="rint">CSS3 선택자 기본</h1>
    <h2 id="rint">CSS3 선택자 기본</h2>
    <h3 id="rint">CSS3 선택자 기본</h3>
  </body>
</html>
