<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      .item {
        color: red;
      }
      .header {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <!-- 여러개 클래스로 구분해서 사용 -> 재사용성 높임, 자바스크립트로 제어하기 위함 -->
    <h1 class="item header">동해물과 백두산이</h1>
  </body>
</html>
