<!doctype html>
<html>
  <head>
    <title>CSS3 Units</title>
    <style>
      /* 얘가 기준 */
      /* 픽셀: 절댓값		%, em: 상댓값(기준은 부모) */
      /* font사이즈 -> em, width, height -> % 많이 사용, 절댓값(px) 사용 안 좋음 */
      p:nth-child(1) {
      }
      p:nth-child(2) {
        font-size: 100%;
      }
      p:nth-child(3) {
        font-size: 150%;
      }
      p:nth-child(4) {
        font-size: 200%;
      }
    </style>
  </head>
  <body>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
  </body>
</html>
