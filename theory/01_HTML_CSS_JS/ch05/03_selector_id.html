<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      /* 특정 하나 빠르게 스타일 적용 -> 아이디 선택자 */
      #header {
        width: 800px;
        /* margin: 여백, 첫번째 숫자: 상하여백, 두번째: 좌우여백(자동) -> 중앙정렬됨 */
        margin: 0 auto;
        background: red;
      }

      #wrap {
        width: 800px;
        margin: 0 auto;
        overflow: hidden;
      }

      /* 자식태그는 부모태그 속성 상속받음 */
      #aside {
        width: 200px;
        float: left;
        background: blue;
      }

      #content {
        width: 600px;
        float: left;
        background: green;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>#header 태그</h1>
    </div>

    <div id="wrap">
      <div id="aside">
        <h1>#aside 태그</h1>
      </div>
      <div id="content">
        <h1>#content 태그</h1>
      </div>
    </div>
  </body>
</html>
