<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      /* 태그 선택자에서 타입 별로 스타일 적용 가능 */
      input[type='text'] {
        background: red;
      }
      input[type='password'] {
        background: blue;
      }
    </style>
  </head>
  <body>
    <form>
      <input type="text" />
      <input type="password" />
    </form>
  </body>
</html>
