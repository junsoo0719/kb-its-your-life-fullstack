<!doctype html>
<html>
  <head>
    <title>CSS3 Selector Basic</title>
    <style>
      /* 클래스 선택자 매우 중요
        태그 선택자 상관없이 클래스만 봄
        h1.select, p.select와 같은 식으로 사용 가능 
        여러개에 스타일 적용 -> 클래스 선택자*/
      .select {
        color: red;
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="select">사과</li>
      <li>바나나</li>
      <li class="select">오렌지</li>
      <li>감</li>
    </ul>
  </body>
</html>
