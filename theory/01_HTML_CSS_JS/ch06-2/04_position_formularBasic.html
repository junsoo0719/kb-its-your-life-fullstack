<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>position_formularBasic</title>
    <style>
      /* div box만 absolute이고 h1은 기본으로 static */
      .box {
        width: 100px;
        height: 100px;
        position: absolute;
      }

      .box:nth-child(1) {
        background-color: red;
        left: 10px;
        top: 10px;
        z-index: 100;
      }

      .box:nth-child(2) {
        background-color: green;
        left: 50px;
        top: 50px;
        z-index: 10;
      }

      .box:nth-child(3) {
        background-color: blue;
        left: 90px;
        top: 90px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum dolor amet</h1>

    <div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h1>Lorem ipsum dolor amet</h1>
  </body>
</html>
