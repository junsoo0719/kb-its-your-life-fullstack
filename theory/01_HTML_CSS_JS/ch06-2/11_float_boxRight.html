<!doctype html>
<html>
  <head>
    <title>CSS3 Float Property</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        margin: 10px;
        padding: 10px;
        /* 태그를 오른으로 붙입니다. */
        /* 오른쪽 정렬과 다름
        오른쪽 정렬: 오른쪽 끝에 1 2 순서로 보임
        float: right -> 오른쪽 끝 벽이 1 */
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="box">1</div>
    <div class="box">2</div>
  </body>
</html>
