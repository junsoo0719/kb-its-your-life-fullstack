<!doctype html>
<html>
  <head>
    <title>CSS Property Basic</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: red;

        /* margin: <위아래> <왼쪽오른쪽> (보통 상하/좌우 같은 값 주기 때문) */
        /* padding: <위아래> <왼쪽오른쪽> */
        /* 위의 p margin-bottom: 20px이고 아래의 p margin-top: 10px인 경우 두 p 사이는 20px
        둘중 큰 값이 선택됨 30px 아님 */
        margin: 0 30px;
        padding: 0 30px;
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
