<!doctype html>
<html>
  <head>
    <title>CSS3 Display Property</title>
    <style>
      #box {
        /* inline-block: width, height, margin, padding 속성 지정 ex) img 태그 */
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <span>더미 객체</span>
    <div id="box">대상 객체</div>
    <span>더미 객체</span>
  </body>
</html>
