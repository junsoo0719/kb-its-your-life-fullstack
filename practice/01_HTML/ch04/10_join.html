<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>회원가입</legend>
        <table>
          <tr>
            <td>
              <label for="userid"><b>사용자 ID</b></label>
            </td>
            <td><input id="userid" name="userid" type="text" /></td>
          </tr>

          <tr>
            <td>
              <label for="password"><b>비밀번호</b></label>
            </td>
            <td><input id="password" name="password" type="password" /></td>
          </tr>

          <tr>
            <td>
              <label for="pwcheck"><b>비밀번호 확인</b></label>
            </td>
            <td><input id="pwcheck" name="pwcheck" type="password" /></td>
          </tr>

          <tr>
            <td>
              <label for="name"><b>이름</b></label>
            </td>
            <td><input id="name" name="name" type="text" /></td>
          </tr>

          <tr>
            <td><b>성별</b></td>
            <td>
              <input id="man" type="radio" name="gender" value="m" />
              <label for="man">남자</label>
              <input id="woman" type="radio" name="gender" value="w" />
              <label for="woman">여자</label>
            </td>
          </tr>

          <tr>
            <td><b>취미</b></td>
            <td>
              <input
                id="football"
                type="checkbox"
                name="hobby"
                value="football"
              />
              <label for="football">축구</label>
              <input
                id="baseball"
                type="checkbox"
                name="hobby"
                value="baseball"
              />
              <label for="baseball">야구</label>
              <input
                id="volleyball"
                type="checkbox"
                name="hobby"
                value="volleyball"
              />
              <label for="volleyball">배구</label>
              <input
                id="basketball"
                type="checkbox"
                name="hobby"
                value="basketball"
              />
              <label for="basketball">농구</label>
            </td>
          </tr>

          <tr>
            <td>
              <label for="mail"><b>email</b></label>
            </td>
            <td><input id="mail" type="email" name="mail" /></td>
          </tr>

          <tr>
            <td>
              <label for="role"><b>역할</b></label>
            </td>
            <td>
              <select id="role" name="role">
                <option>ADMIN</option>
                <option>관리자</option>
                <option>일반회원</option>
              </select>
            </td>
          </tr>
        </table>
        <input type="submit" value="확인" />
        <input type="reset" value="다시쓰기" />
      </fieldset>
    </form>
  </body>
</html>
