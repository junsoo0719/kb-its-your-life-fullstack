<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function callBackFunc(callback, count) {
        for (let i = 0; i < count; i++) {
          callback();
        }
      }

      let func = function () {
        alert('함수 호출');
      };

      callBackFunc(func, 5);
    </script>
  </head>
  <body></body>
</html>
