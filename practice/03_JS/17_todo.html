<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .lineThrough {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h1>오늘 할 일</h1>
    <ul></ul>
    <label for="todo">할 일: </label>
    <input id="todo" type="text" />
    <button id="add">할 일 추가</button>

    <script>
      const list = document.querySelector('ul');
      const addBtn = document.querySelector('#add');

      addBtn.addEventListener('click', function () {
        const newTodo = document.createElement('li');
        const input = document.querySelector('#todo');
        newTodo.textContent = input.value;
        // newTodo.createElement('button')

        // newTodo.textContent = '이 닦기';

        newTodo.addEventListener('click', function () {
          newTodo.classList.toggle('lineThrough');
          // if (!newTodo.classList.contains('lineThrough')) {
          //   newTodo.classList.add('lineThrough');
          // } else {
          //   newTodo.classList.remove('lineThrough');
          // }
        });

        const delBtn = document.createElement('button');
        delBtn.textContent = '삭제 버튼';
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.target.parentNode.remove();
        });
        newTodo.append(delBtn);

        list.append(newTodo);
      });
    </script>
  </body>
</html>
