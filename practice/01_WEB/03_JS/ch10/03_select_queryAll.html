<!doctype html>
<html>
  <head>
    <script>
      window.onload = function () {
        let headers = document.querySelectorAll('h1');
        for (let i in headers) {
          let header = headers[i];
          header.style.color = 'orange';
          header.style.backgroundColor = 'red';
          header.innerHTML = 'From JavaScript';
        }
      };
    </script>
  </head>
  <body>
    <h1>Header</h1>
    <h1>Header</h1>
    <h1>Header</h1>
  </body>
</html>
