<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 5</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="mb-5"><i class="fa-solid fa-user-plus"></i> 회원 가입</h1>

      <form>
        <div class="mt-3">
          <label for="userid" class="mb-2"
            ><i class="fa-solid fa-user"></i> 사용자 ID:</label
          >
          <input type="text" class="form-control" id="userid" name="userid" />
        </div>
        <div class="mt-3">
          <label for="pw" class="mb-2"
            ><i class="fa-solid fa-lock"></i> 비밀번호:</label
          >
          <input type="password" class="form-control" id="pw" name="pw" />
        </div>
        <div class="mt-3">
          <label for="pwcheck" class="mb-2"
            ><i class="fa-solid fa-lock"></i> 비밀번호 확인:</label
          >
          <input
            type="password"
            class="form-control"
            id="pwcheck"
            name="pwcheck"
          />
        </div>
        <div class="mt-3">
          <label for="email"
            ><i class="fa-regular fa-envelope"></i> email:</label
          >
          <input type="email" class="form-control" id="email" name="email" />
        </div>
        <div class="mt-3">
          <label for="avatar">
            <i class="fa-solid fa-user-astronaut"></i> 아바타 이미지</label
          >
          <input type="file" class="form-control" id="avatar" name="avatar" />
        </div>

        <button type="submit" class="btn btn-primary form-control mt-3">
          <i class="fa-solid fa-user-plus"></i> 회원가입
        </button>
      </form>
    </div>
  </body>
</html>
