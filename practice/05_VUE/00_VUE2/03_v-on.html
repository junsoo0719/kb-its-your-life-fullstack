<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <img v-bind:src="imgSrc" />
      <button v-on:click="changeImgSrc">이미지 변경</button>
    </div>
    <script>
      Vue.createApp({
        name: 'App',
        data() {
          return {
            imgSrc:
              'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEkg8YT1K0EhwNo6-A4TRwZ_NI97sfdmcpqw&s',
          };
        },
        methods: {
          changeImgSrc() {
            this.imgSrc =
              'https://www.chosun.com/resizer/v2/ZRL5XVHKZVQZAZMEYDEDWENZGY.jpg?auth=c2535f7e1aac3ec04531377802d30d4199bc4b948f31507e0ae04a02cba31025&width=530&height=675&smart=true';
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
