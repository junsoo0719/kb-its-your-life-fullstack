<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* rem기준: root(모든 html문서의 루트는 <html> 16px 고정) */
      .parent {
        font-size: 1.5rem;
      }
      .child {
        font-size: 1.5rem;
      }
      /* em기준: 부모(parent2기준: html이지만 child2기준: parent2이므로 더 커짐) */
      .parent2 {
        font-size: 1.5em;
      }
      .child2 {
        font-size: 1.5em;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      parent
      <div class="child">child</div>
    </div>
    <div class="parent2">
      parent
      <div class="child2">child</div>
    </div>
  </body>
</html>
