<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .menu {
        display: flex;
        justify-content: center;
        width: 700px;
        height: 50px;
        background-color: #ccc;
      }
      .item {
        display: flex;
        flex-grow: 1;
        justify-content: center;
        align-items: center;
        background-color: orange;
        list-style: none;
      }
      .menu > .item:nth-child(2n) {
        background-color: skyblue;
      }
      .item:first-child {
        border-radius: 20px 0 0 20px;
      }
      .item:last-child {
        border-radius: 0 20px 20px 0;
      }
    </style>
  </head>
  <body>
    <nav class="menu">
      <li class="item">첫 번째</li>
      <li class="item">두 번째</li>
      <li class="item">세 번째</li>
      <li class="item">네 번째</li>
      <li class="item">다섯번째</li>
      <li class="item">여섯번째</li>
      <li class="item">일곱번째</li>
    </nav>
  </body>
</html>
